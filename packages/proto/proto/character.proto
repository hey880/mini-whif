syntax = "proto3";

package persona_chat.character.v1;

// Character Service - CRUD operations for AI characters
service CharacterService {
  rpc ListCharacters(ListCharactersRequest) returns (ListCharactersResponse);
  rpc GetCharacter(GetCharacterRequest) returns (GetCharacterResponse);
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  rpc UpdateCharacter(UpdateCharacterRequest) returns (UpdateCharacterResponse);
  rpc DeleteCharacter(DeleteCharacterRequest) returns (DeleteCharacterResponse);
  rpc ListCharactersByUniverse(ListCharactersByUniverseRequest) returns (ListCharactersByUniverseResponse);
}

message ListCharactersRequest {
  optional string keyword = 1;
  optional string name = 2;
  optional string visibility = 3; // public, private
  optional bool is_nsfw = 4;
  optional string creator_id = 5;
  optional string universe_id = 6;
  int32 limit = 7;
  int32 offset = 8;
}

message ListCharactersResponse {
  repeated Character characters = 1;
  int32 total = 2;
  bool has_more = 3;
}

message GetCharacterRequest {
  string id = 1;
}

message GetCharacterResponse {
  Character character = 1;
}

message CreateCharacterRequest {
  string name = 1;
  optional string tagline = 2;
  optional string description = 3; // UI 표시용 설명 (2000자 제한)
  optional string ai_prompt_description = 4; // AI 프롬프트용 설명 (5000자 제한)
  optional string greeting = 5;
  optional string image_url = 6;
  optional string banner_image_url = 7;
  string visibility = 8; // public, private
  bool is_nsfw = 9;
  optional string universe_id = 10;
  repeated string keywords = 11;
  optional string data_json = 12; // JSON string of CharacterData
  optional string lorebook_json = 13; // JSON string of CharacterLorebook
}

message CreateCharacterResponse {
  Character character = 1;
}

message UpdateCharacterRequest {
  string id = 1;
  optional string name = 2;
  optional string tagline = 3;
  optional string description = 4; // UI 표시용 설명
  optional string ai_prompt_description = 5; // AI 프롬프트용 설명
  optional string greeting = 6;
  optional string image_url = 7;
  optional string banner_image_url = 8;
  optional string visibility = 9;
  optional bool is_nsfw = 10;
  optional string universe_id = 11;
  repeated string keywords = 12;
  optional string data_json = 13;
  optional string lorebook_json = 14;
}

message UpdateCharacterResponse {
  Character character = 1;
}

message DeleteCharacterRequest {
  string id = 1;
}

message DeleteCharacterResponse {
  bool success = 1;
}

message Character {
  string id = 1;
  string name = 2;
  optional string tagline = 3;
  optional string description = 4; // UI 표시용 설명
  optional string ai_prompt_description = 5; // AI 프롬프트용 설명
  optional string greeting = 6;
  optional string image_url = 7;
  optional string banner_image_url = 8;
  string visibility = 9;
  bool is_nsfw = 10;
  string creator_id = 11;
  optional string universe_id = 12;
  repeated string keywords = 13;
  string data_json = 14;
  optional string lorebook_json = 15;
  string created_at = 16;
  string updated_at = 17;
  int32 total_chat_count = 18;
  int32 total_message_count = 19;
  double avg_rating = 20;
  optional string creator_display_name = 21;
}

message ListCharactersByUniverseRequest {
  string universe_id = 1;
}

message ListCharactersByUniverseResponse {
  repeated CharacterCard characters = 1;
}

message CharacterCard {
  string id = 1;
  string name = 2;
  optional string image_url = 3;
  optional string tagline = 4;
  optional string description = 5;
}
