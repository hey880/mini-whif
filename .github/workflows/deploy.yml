name: Deploy to AWS EC2

on:
  push:
    branches: [master]
  workflow_dispatch: # 수동 트리거 허용

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # GitHub Environment 사용 (선택)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /home/ubuntu/mini-whif

            # 최신 코드 가져오기
            git fetch origin
            git reset --hard origin/master

            # 로그 디렉토리 생성 및 권한 설정
            mkdir -p logs/api logs/ai
            sudo chown -R whif:whif logs
            sudo chmod 775 logs/api logs/ai
            # 기존 로그 파일이 있다면 권한 수정
            [ -f logs/api/api.log ] && sudo chmod 664 logs/api/*.log || true
            [ -f logs/ai/ai-server.log ] && sudo chmod 664 logs/ai/*.log || true

            # Logrotate 설정 파일 복사
            sudo cp logrotate/mini-whif-api /etc/logrotate.d/ || true
            sudo cp logrotate/mini-whif-ai /etc/logrotate.d/ || true
            sudo chmod 644 /etc/logrotate.d/mini-whif-api /etc/logrotate.d/mini-whif-ai || true

            # 환경 변수 업데이트
            echo "${{ secrets.ENV_FILE }}" > .env

            # 이미지 빌드 및 재시작
            docker-compose -f docker-compose.prod.yml pull || true
            docker-compose -f docker-compose.prod.yml build --pull api ai-server
            docker-compose -f docker-compose.prod.yml build --no-cache --pull web
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            # 오래된 이미지 정리
            docker image prune -f

            # 헬스 체크
            sleep 10
            curl -f http://localhost:3000/health || exit 1
            curl -f http://localhost:8000/health || exit 1

            echo "✅ Deployment successful!"
