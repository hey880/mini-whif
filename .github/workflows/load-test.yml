name: Load Tests

on:
  # Manual execution
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike

  # Run smoke tests on PR (optional)
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/api/**'
      - 'apps/ai-server/**'
      - 'packages/**'

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.4.0

      - name: Install dependencies
        run: pnpm install

      - name: Setup test database
        working-directory: load-tests
        run: pnpm setup
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_USER_COUNT: 50
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Start services (Docker Compose)
        run: docker-compose -f docker-compose.test.yml up -d
        continue-on-error: true

      - name: Wait for services
        run: sleep 30

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Verify k6 installation
        run: k6 version

      - name: Run smoke tests
        if: github.event_name == 'pull_request' || github.event.inputs.test_type == 'smoke'
        working-directory: load-tests
        run: |
          pnpm smoke
          pnpm smoke:auth
        env:
          API_URL: http://localhost:3000
          AI_SERVER_URL: http://localhost:8000

      - name: Run load tests
        if: github.event.inputs.test_type == 'load'
        working-directory: load-tests
        run: pnpm load:mixed
        env:
          API_URL: http://localhost:3000
          AI_SERVER_URL: http://localhost:8000

      - name: Run stress tests
        if: github.event.inputs.test_type == 'stress'
        working-directory: load-tests
        run: pnpm stress
        env:
          API_URL: http://localhost:3000
          AI_SERVER_URL: http://localhost:8000

      - name: Run spike tests
        if: github.event.inputs.test_type == 'spike'
        working-directory: load-tests
        run: pnpm spike
        env:
          API_URL: http://localhost:3000
          AI_SERVER_URL: http://localhost:8000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.event.inputs.test_type || 'smoke' }}
          path: load-tests/results/*.json
          retention-days: 30

      - name: Display test summary
        if: always()
        run: |
          echo "## Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test type: ${{ github.event.inputs.test_type || 'smoke' }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup test data
        if: always()
        working-directory: load-tests
        run: pnpm cleanup
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      - name: Stop services
        if: always()
        run: docker-compose -f docker-compose.test.yml down
        continue-on-error: true
